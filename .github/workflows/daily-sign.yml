name: 小黑盒每日签到

on:
  schedule:
  - cron: '17 0 * * *'
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run 小黑盒签到
        env:
          heybox_ck: ${{ secrets.HEYBOX_CK }}
        run: node heybox_sign.js

      - name: Run 0元抽奖盒券
        env:
          heybox_ck: ${{ secrets.HEYBOX_CK }}
        run: node heybox_roll.js
